name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh -n deploy/remote-deploy.sh
          /bin/sh deploy/tests/remote-deploy-test.sh
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/blue-green-test.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/blue-green-evidence-test.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/blue-green-preflight-test.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  stream-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Claude 流重试、空闲计时与压缩响应关闭竞态检查
        working-directory: backend
        env:
          CGO_ENABLED: '1'
        run: >-
          go test -race -tags=unit -count=1
          -run 'TestKimi|TestOpsErrorLoggerMiddleware_Kimi|TestAnthropicStreamSafeRetry|TestFirstTokenCleanup|TestGatewayService_AnthropicAPIKeyPassthrough_StreamingIdleTimeout|TestDecompressResponseBodyStreamClose|TestDecompressedBodyClose'
          ./internal/service ./internal/handler ./internal/repository

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            canvas/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install canvas dependencies
        working-directory: canvas
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend
      - name: Build Vue and canvas frontends
        run: make build-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  lifecycle-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lifecycle, usage and owner race tests
        working-directory: backend
        run: |
          mkdir -p ../.cache/tmp
          export TMPDIR="$(pwd)/../.cache/tmp"
          go test -race -tags=unit ./internal/pkg/lifecycle ./internal/service ./internal/repository ./internal/handler -run 'TestPeer|TestAffinity|TestPublicPeer|TestLongSSE|TestHijacked|TestDetachedProducer|TestControl|TestDrain|TestNewInstance|TestLegacyWaits|TestRenewal|TestUsageRecordWorkerPool_StopRace|TestStoppedKeyed|TestOpenAIResponsesWebSocket_Ingress'

  bluegreen-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build real application for isolated deployment test
        run: |
          mkdir -p .cache/tmp .analysis_tmp
          export TMPDIR="$GITHUB_WORKSPACE/.cache/tmp"
          go -C backend build -o ../.cache/bluegreen-server ./cmd/server
          git fetch --no-tags --depth=1 origin cfd9afa871def9ebd457bb95fb4c2e8b4b02b34f
          mkdir -p .cache/legacy-source
          git archive cfd9afa871def9ebd457bb95fb4c2e8b4b02b34f backend | tar -x -C .cache/legacy-source
          go -C .cache/legacy-source/backend build -o ../../bluegreen-legacy-server ./cmd/server
      - name: Twenty mixed-protocol switches with local mock upstream
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/.cache/tmp"
          python3 deploy/tests/blue-green-integration.py --cycles 20 --legacy-binary .cache/bluegreen-legacy-server
      - name: Forced retirement with isolated Docker and Redis
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/.cache/tmp"
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/blue-green-force-integration.py
      - name: Upload isolated protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bluegreen-protocol-evidence
          include-hidden-files: true
          path: |
            .analysis_tmp/bluegreen-protocol-result.json
            .cache/tmp/bg-*/*.log
          retention-days: 7

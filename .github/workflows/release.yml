name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (or a branch/ref for dry run)'
        required: true
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      deploy_production:
        description: 'Deploy production after release'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Build and verify all selected artifacts without publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIMPLE_RELEASE: ${{ inputs.simple_release == true || vars.SIMPLE_RELEASE == 'true' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      owner_lower: ${{ steps.plan.outputs.owner_lower }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      matrix: ${{ steps.plan.outputs.matrix }}
      simple: ${{ steps.plan.outputs.simple }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve tooling for releases of older tags
        run: cp -R .github/release-tools "$RUNNER_TEMP/release-tools"
      - name: Checkout selected application source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Resolve one source commit and target matrix
        id: plan
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          args=(--ref "$REQUESTED_REF")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" plan "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            canvas/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

      - name: Install canvas dependencies
        run: pnpm install --frozen-lockfile
        working-directory: canvas

      - name: Typecheck and build canvas
        run: pnpm run build
        working-directory: canvas

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  build-binaries:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          name: version-file
          path: backend/cmd/server/
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: go version | grep -q 'go1.27.0'
      - name: Restore target-specific Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Select one GoReleaser target
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" config build --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output "$RUNNER_TEMP/goreleaser.matrix.yaml"
      - name: Build and archive without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --timeout 120m --skip=validate,publish,docker,announce --config=${{ runner.temp }}/goreleaser.matrix.yaml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: ''
      - name: Verify and collect the target archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" collect --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output matrix-output
      - uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-output/
          if-no-files-found: error
          retention-days: 1
      - name: Save updated target cache
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  release:
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SIMPLE_RELEASE: ${{ needs.prepare.outputs.simple }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN_AVAILABLE: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          path: release-input
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Verify complete matrix and prepare Docker contexts
        run: |
          args=(--version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --input release-input --output .release-context)
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" contexts "${args[@]}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN_AVAILABLE == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images and publish manifests
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_TOKEN_AVAILABLE == 'true' && env.DOCKERHUB_USERNAME || 'skip' }}
        run: bash "$RUNNER_TEMP/release-tools/release-images.sh"
      - name: Get annotated tag notes
        id: tag_message
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")
          DELIMITER="TAG_MESSAGE_$(openssl rand -hex 16)"
          {
            echo "message<<$DELIMITER"
            echo "$TAG_MESSAGE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare publication-only GoReleaser config
        run: |
          args=(publish --output "$RUNNER_TEMP/goreleaser.publisher.yaml")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" config "${args[@]}"
      - name: Publish existing archives and release notes
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --timeout 120m --skip=validate,before,docker ${{ env.DRY_RUN == 'true' && '--snapshot --skip=publish,announce' || '' }} --config=${{ runner.temp }}/goreleaser.publisher.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME || 'skip' }}
      - name: Upload dry-run checksums and metadata
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-report
          path: |
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json
          if-no-files-found: error
          retention-days: 3

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN_AVAILABLE == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' }}
        env:
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [prepare, release]
    if: ${{ needs.release.result == 'success' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        run: |
          VERSION="$RELEASE_VERSION"

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  deploy-production:
    concurrency:
      group: sub2api-production-deploy
      cancel-in-progress: false
    needs: [prepare, release]
    if: ${{ needs.release.result == 'success' && needs.prepare.outputs.dry_run != 'true' && needs.prepare.outputs.simple != 'true' && (github.event_name == 'push' || github.event.inputs.deploy_production == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Check deployment configuration
        id: deploy_config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '216.152.153.86' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22748' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || vars.DEPLOY_DIR || '/root/proj/sub2api/deploy' }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || vars.DEPLOY_COMPOSE_FILE || 'docker-compose.yml' }}
          DEPLOY_UPLOAD_COMPOSE: ${{ secrets.DEPLOY_UPLOAD_COMPOSE || vars.DEPLOY_UPLOAD_COMPOSE || 'false' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "生产部署配置不完整；拒绝将跳过部署报告为成功。" >&2
            exit 1
          fi
          if [ "$DEPLOY_HOST" != "216.152.153.86" ] || [ "$DEPLOY_USER" != "root" ] || [ "$DEPLOY_PORT" != "22748" ] || [ "$DEPLOY_DIR" != "/root/proj/sub2api/deploy" ] || [ "$DEPLOY_COMPOSE_FILE" != "docker-compose.yml" ]; then
            echo "生产部署目标必须是新生产机及其指定活动Compose；旧机仅转发，拒绝向旧机部署。" >&2
            exit 1
          fi
          if [ "$DEPLOY_UPLOAD_COMPOSE" != "false" ]; then
            echo "蓝绿发布不覆盖生产 Compose，配置变更必须先单独审定。" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "host=$DEPLOY_HOST" >> "$GITHUB_OUTPUT"
          echo "user=$DEPLOY_USER" >> "$GITHUB_OUTPUT"
          echo "port=$DEPLOY_PORT" >> "$GITHUB_OUTPUT"
          echo "dir=$DEPLOY_DIR" >> "$GITHUB_OUTPUT"
          echo "compose_file=$DEPLOY_COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "upload_compose=$DEPLOY_UPLOAD_COMPOSE" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release
        id: version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}/sub2api
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || exit 1
          SHA=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SHA"
          mkdir -p .cache/deployment
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:${RELEASE_TAG#v}" --format '{{.Manifest.Digest}}')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prepare project-local SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p .cache/deployment/ssh
          chmod 700 .cache/deployment/ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > .cache/deployment/ssh/key
          chmod 600 .cache/deployment/ssh/key
          touch .cache/deployment/ssh/known_hosts

      - name: Read deployment state or discover legacy baseline
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.host }}
          DEPLOY_USER: ${{ steps.deploy_config.outputs.user }}
          DEPLOY_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_DIR: ${{ steps.deploy_config.outputs.dir }}
        run: |
          ssh -i .cache/deployment/ssh/key -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.cache/deployment/ssh/known_hosts -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 - --directory '$DEPLOY_DIR' --snapshot" < deploy/blue-green/deploy.py > .cache/deployment/state.json

      - name: Bind successful CI and migration baseline to digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          RELEASE_IMAGE: ${{ steps.version.outputs.image }}
        run: |
          python3 deploy/blue-green/evidence.py --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --image "$RELEASE_IMAGE" --state .cache/deployment/state.json --output .cache/deployment/release.json

      - name: Upload immutable deployment inputs
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.host }}
          DEPLOY_USER: ${{ steps.deploy_config.outputs.user }}
          DEPLOY_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_DIR: ${{ steps.deploy_config.outputs.dir }}
        run: |
          SSH_OPTS="-i .cache/deployment/ssh/key -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.cache/deployment/ssh/known_hosts"
          # 每个 Actions run 使用独立输入目录；不覆盖运行中的执行器或生产配置。
          REMOTE="$DEPLOY_DIR/blue-green/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p '$REMOTE'"
          for FILE in deploy.py release.json; do
            SOURCE="deploy/blue-green/$FILE"
            if [ "$FILE" = release.json ]; then SOURCE=.cache/deployment/release.json; fi
            ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > '$REMOTE/$FILE.next' && mv '$REMOTE/$FILE.next' '$REMOTE/$FILE'" < "$SOURCE"
          done

      - name: Blue-green deploy and observe natural drain
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.host }}
          DEPLOY_USER: ${{ steps.deploy_config.outputs.user }}
          DEPLOY_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_DIR: ${{ steps.deploy_config.outputs.dir }}
        run: |
          REMOTE="$DEPLOY_DIR/blue-green/releases/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # 不使用旧的原地重启脚本，也不以 300 秒 SSH 超时终止排空观察。
          ssh -i .cache/deployment/ssh/key -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.cache/deployment/ssh/known_hosts -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 '$REMOTE/deploy.py' --directory '$DEPLOY_DIR' --release '$REMOTE/release.json' --window 3600 --force-after-window --legacy-window 1200 --legacy-quiet 900"

      - name: Collect deployment state without secrets
        if: always()
        env:
          DEPLOY_HOST: ${{ steps.deploy_config.outputs.host }}
          DEPLOY_USER: ${{ steps.deploy_config.outputs.user }}
          DEPLOY_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_DIR: ${{ steps.deploy_config.outputs.dir }}
        run: |
          if [ ! -f .cache/deployment/ssh/key ]; then exit 0; fi
          ssh -i .cache/deployment/ssh/key -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.cache/deployment/ssh/known_hosts -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat '$DEPLOY_DIR/blue-green/state.json'" > .cache/deployment/result.json || true
          ssh -i .cache/deployment/ssh/key -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.cache/deployment/ssh/known_hosts -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat '$DEPLOY_DIR/blue-green/observation.json'" > .cache/deployment/observation.json || true
          if [ -s .cache/deployment/result.json ]; then
            python3 - <<'PYCODE'
          import json, os
          with open('.cache/deployment/result.json') as stream:
              state = json.load(stream)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 蓝绿部署状态\n```json\n'+json.dumps({k:state.get(k) for k in ('phase','generation','active','pending','pending_reason','switch_seconds','switched_at','drain_started_at','drained_at','retired_at','forced_retire_result','legacy_retired_at','legacy_retire_result','resources','last_error')},ensure_ascii=False,indent=2)+'\n```\n')
              forced = state.get('forced_retire_result')
              if forced and forced.get('release_sha') == state.get('release',{}).get('sha'):
                  summary.write('**本次发生强制退役，旧请求可能中断；请检查退出码、用量风险及关停日志，不得视为零错误验收。**\n')
              if state.get('pending'):
                  summary.write('**旧实例仍保留，尚未完成退役；下一次发布不得覆盖其槽位。**\n')
              if os.path.getsize('.cache/deployment/observation.json'):
                  summary.write('## 双入口连续健康检查\n```json\n'+open('.cache/deployment/observation.json').read()+'\n```\n')
          PYCODE
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blue-green-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/deployment/release.json
            .cache/deployment/result.json
            .cache/deployment/observation.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify legacy retirement outcome
        if: always()
        env:
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          test -s .cache/deployment/result.json || exit 0
          python3 - <<'PYCODE'
          import json, os
          with open('.cache/deployment/result.json') as stream:
              state = json.load(stream)
          result = state.get('legacy_retire_result')
          if result is not None and result.get('release_sha') == os.environ['RELEASE_SHA'] and result.get('clean') is not True:
              raise SystemExit('旧版已退役，但检测到 stopped 用量丢弃或强制关停；发布证据不合格')
          PYCODE

      - name: Remove SSH credentials
        if: always()
        run: rm -f .cache/deployment/ssh/key
